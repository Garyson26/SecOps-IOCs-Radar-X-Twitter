<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="SecOps IOC Radar X - Tactical Threat Intelligence and OSINT Extractor for X.com">
  <title>SecOps IOC Radar X</title>
  <desc>Tactical Threat Intelligence and OSINT Extractor for X.com (Twitter)</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b0e"/>
      <stop offset="0.55" stop-color="#04090c"/>
      <stop offset="1" stop-color="#020506"/>
    </linearGradient>

    <radialGradient id="haloGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1de08a" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#1de08a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1de08a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bff9f" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#2bff9f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2bff9f" stop-opacity="0.01"/>
    </radialGradient>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#1de08a" opacity="0.085"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="330" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ground -->
    <rect x="0" y="0" width="1200" height="330" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="330" fill="url(#dots)"/>
    <ellipse cx="175" cy="165" rx="300" ry="230" fill="url(#haloGreen)"/>
    <ellipse cx="1080" cy="250" rx="260" ry="180" fill="url(#haloAmber)"/>

    <!-- radar scope -->
    <g transform="translate(175 165)">
      <circle r="112" fill="#04120c" opacity="0.55"/>
      <g fill="none" stroke="#1de08a" stroke-opacity="0.20">
        <circle r="28"/><circle r="56"/><circle r="84"/>
      </g>
      <circle r="112" fill="none" stroke="#22e07a" stroke-opacity="0.55" stroke-width="1.6"/>
      <g stroke="#1de08a" stroke-opacity="0.16">
        <line x1="-112" y1="0" x2="112" y2="0"/>
        <line x1="0" y1="-112" x2="0" y2="112"/>
        <line x1="-79" y1="-79" x2="79" y2="79" stroke-opacity="0.09"/>
        <line x1="-79" y1="79" x2="79" y2="-79" stroke-opacity="0.09"/>
      </g>
      <!-- sweep wedge: -75deg to -20deg -->
      <path d="M 0 0 L 28.99 -108.18 A 112 112 0 0 1 105.25 -38.30 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="28.99" y2="-108.18" stroke="#5cffb8" stroke-opacity="0.75" stroke-width="1.6"/>
      <circle r="3.2" fill="#7dffc4"/>
      <!-- contacts -->
      <g>
        <circle cx="75" cy="-25" r="4.2" fill="#8dffcd"/>
        <circle cx="75" cy="-25" r="9" fill="none" stroke="#8dffcd" stroke-opacity="0.35"/>
        <circle cx="-35" cy="-55" r="3.2" fill="#2bff9f" opacity="0.85"/>
        <circle cx="50" cy="40" r="2.8" fill="#2bff9f" opacity="0.6"/>
        <circle cx="-65" cy="35" r="3.4" fill="#ff8a3d" opacity="0.9"/>
        <circle cx="-65" cy="35" r="8" fill="none" stroke="#ff8a3d" stroke-opacity="0.3"/>
        <circle cx="-15" cy="75" r="2.4" fill="#2bff9f" opacity="0.45"/>
      </g>
    </g>

    <!-- top ruler -->
    <g stroke="#1de08a">
      <line x1="340" y1="34" x2="1160" y2="34" stroke-opacity="0.10"/>
      <g stroke-opacity="0.22">
        <line x1="340" y1="27" x2="340" y2="41"/>
        <line x1="440" y1="27" x2="440" y2="41"/>
        <line x1="540" y1="27" x2="540" y2="41"/>
        <line x1="640" y1="27" x2="640" y2="41"/>
        <line x1="740" y1="27" x2="740" y2="41"/>
        <line x1="840" y1="27" x2="840" y2="41"/>
        <line x1="940" y1="27" x2="940" y2="41"/>
        <line x1="1040" y1="27" x2="1040" y2="41"/>
        <line x1="1160" y1="27" x2="1160" y2="41"/>
      </g>
      <g stroke-opacity="0.11">
        <line x1="360" y1="31" x2="360" y2="37"/><line x1="380" y1="31" x2="380" y2="37"/>
        <line x1="400" y1="31" x2="400" y2="37"/><line x1="420" y1="31" x2="420" y2="37"/>
        <line x1="460" y1="31" x2="460" y2="37"/><line x1="480" y1="31" x2="480" y2="37"/>
        <line x1="500" y1="31" x2="500" y2="37"/><line x1="520" y1="31" x2="520" y2="37"/>
        <line x1="560" y1="31" x2="560" y2="37"/><line x1="580" y1="31" x2="580" y2="37"/>
        <line x1="600" y1="31" x2="600" y2="37"/><line x1="620" y1="31" x2="620" y2="37"/>
        <line x1="660" y1="31" x2="660" y2="37"/><line x1="680" y1="31" x2="680" y2="37"/>
        <line x1="700" y1="31" x2="700" y2="37"/><line x1="720" y1="31" x2="720" y2="37"/>
        <line x1="760" y1="31" x2="760" y2="37"/><line x1="780" y1="31" x2="780" y2="37"/>
        <line x1="800" y1="31" x2="800" y2="37"/><line x1="820" y1="31" x2="820" y2="37"/>
        <line x1="860" y1="31" x2="860" y2="37"/><line x1="880" y1="31" x2="880" y2="37"/>
        <line x1="900" y1="31" x2="900" y2="37"/><line x1="920" y1="31" x2="920" y2="37"/>
        <line x1="960" y1="31" x2="960" y2="37"/><line x1="980" y1="31" x2="980" y2="37"/>
        <line x1="1000" y1="31" x2="1000" y2="37"/><line x1="1020" y1="31" x2="1020" y2="37"/>
        <line x1="1060" y1="31" x2="1060" y2="37"/><line x1="1080" y1="31" x2="1080" y2="37"/>
        <line x1="1100" y1="31" x2="1100" y2="37"/><line x1="1120" y1="31" x2="1120" y2="37"/>
        <line x1="1140" y1="31" x2="1140" y2="37"/>
      </g>
    </g>

    <!-- wordmark -->
    <text x="340" y="95" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" letter-spacing="4.6" fill="#41926f">SECOPS &#183; OSINT &#183; THREAT INTELLIGENCE</text>

    <g font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="2.5">
      <text x="340" y="170" fill="#2bff9f" opacity="0.45" filter="url(#soft)">IOC RADAR X</text>
      <text x="340" y="170" fill="#eafff6">IOC RADAR X</text>
    </g>

    <text x="340" y="209" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#93b8ab">Tactical Threat Intelligence &amp; OSINT Extractor for X.com</text>

    <!-- capability chips -->
    <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#7fd8ab">
      <rect x="340" y="237" width="150" height="28" rx="14" fill="#0a1f17" stroke="#1c4d3a"/>
      <text x="415" y="255.5" text-anchor="middle" dominant-baseline="middle">STEALTH CRAWLER</text>

      <rect x="500" y="237" width="133" height="28" rx="14" fill="#0a1f17" stroke="#1c4d3a"/>
      <text x="566.5" y="255.5" text-anchor="middle" dominant-baseline="middle">15+ IOC TYPES</text>

      <rect x="643" y="237" width="125" height="28" rx="14" fill="#0a1f17" stroke="#1c4d3a"/>
      <text x="705.5" y="255.5" text-anchor="middle" dominant-baseline="middle">MITRE ATT&amp;CK</text>

      <rect x="778" y="237" width="182" height="28" rx="14" fill="#0a1f17" stroke="#1c4d3a"/>
      <text x="869" y="255.5" text-anchor="middle" dominant-baseline="middle">PDF / HTML DOSSIERS</text>
    </g>

    <!-- live indicator -->
    <g>
      <circle cx="1148" cy="88" r="4" fill="#2bff9f" filter="url(#softer)"/>
      <circle cx="1148" cy="88" r="3" fill="#5cffb8"/>
      <text x="1136" y="92" text-anchor="end" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" letter-spacing="2.4" fill="#41926f">REAL-TIME</text>
    </g>

    <!-- footer slug -->
    <text x="1160" y="298" text-anchor="end" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" letter-spacing="0.8" fill="#2f6b53">github.com/Garyson26/SecOps-IOCs-Radar-X-Twitter</text>

    <!-- HUD corner brackets -->
    <g fill="none" stroke="#22e07a" stroke-opacity="0.42" stroke-width="1.6">
      <path d="M 14 44 L 14 14 L 44 14"/>
      <path d="M 1156 14 L 1186 14 L 1186 44"/>
      <path d="M 1186 286 L 1186 316 L 1156 316"/>
      <path d="M 44 316 L 14 316 L 14 286"/>
    </g>
    <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="12" fill="none" stroke="#1de08a" stroke-opacity="0.16"/>
  </g>
</svg>
